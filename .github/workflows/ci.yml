name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Stage 1 - ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './bin ./lib ./tests'
          severity: warning

  syntax-and-smoke:
    name: Stage 2 - Bash syntax + smoke tests
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run syntax + smoke tests
        run: bash tests/run_tests.sh

  bats:
    name: Stage 3 - Bats tests
    runs-on: ubuntu-latest
    needs: syntax-and-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bats
        uses: mig4/setup-bats@v1
        with:
          bats-version: 1.11.1

      - name: Run Bats suite
        run: bats --print-output-on-failure tests/bats

  package-check:
    name: Stage 4 - Packaging check
    runs-on: ubuntu-latest
    needs: bats
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify tarball
        run: make package-check
