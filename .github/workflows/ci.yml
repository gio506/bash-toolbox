name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            "README.md"
            "CHEATSHEET.md"
            "FILES_EXPLAINED.md"
            "install.sh"
            "Makefile"
            "lib/common.sh"
            "tests/run_tests.sh"
            "tests/bats/cli.bats"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

  shellcheck:
    name: Stage 1 - ShellCheck
    runs-on: ubuntu-latest
    needs: structure-check
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Normalize shell file line endings
        run: |
          find . -type f \( -name '*.sh' -o -path './bin/*' \) -print0 | xargs -0 sed -i 's/\r$//'

      - name: Run ShellCheck
        run: shellcheck -x bin/* lib/*.sh tests/run_tests.sh install.sh

  syntax-and-smoke:
    name: Stage 2 - Bash syntax + smoke tests
    runs-on: ubuntu-latest
    needs: shellcheck
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run syntax + smoke tests
        run: bash tests/run_tests.sh

  bats:
    name: Stage 3 - Bats tests
    runs-on: ubuntu-latest
    needs: syntax-and-smoke
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bats
        uses: mig4/setup-bats@v1
        with:
          bats-version: 1.11.1

      - name: Run Bats suite
        run: bats --print-output-on-failure tests/bats

  package-check:
    name: Stage 4 - Packaging check
    runs-on: ubuntu-latest
    needs: bats
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify tarball
        run: make package-check

  markdown-lint:
    name: Stage 5 - Markdown lint
    runs-on: ubuntu-latest
    needs: package-check
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run markdownlint
        run: |
          npm install --global markdownlint-cli
          markdownlint "**/*.md"

  final-status-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - structure-check
      - shellcheck
      - syntax-and-smoke
      - bats
      - package-check
      - markdown-lint
    steps:
      - name: Aggregate results
        shell: bash
        env:
          STRUCTURE: ${{ needs.structure-check.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          SYNTAX: ${{ needs.syntax-and-smoke.result }}
          BATS: ${{ needs.bats.result }}
          PACKAGE: ${{ needs.package-check.result }}
          MARKDOWN: ${{ needs.markdown-lint.result }}
        run: |
          for result in "$STRUCTURE" "$SHELLCHECK" "$SYNTAX" "$BATS" "$PACKAGE" "$MARKDOWN"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
