name: CI

on:
  push:
    branches: ["main", "work"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck bin/*.sh tests/*.sh

  test:
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          chmod +x tests/test_cli_tools.sh
          ./tests/test_cli_tools.sh
